name: Live pipeline

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Live VLR and YouTube smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Run trusted default-branch code, even when manually dispatched elsewhere.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg libgl1
      - run: uv sync --locked
      - name: Scrape, discover, download, process, validate
        run: uv run --frozen python -m valoscribe.validation.live > ci-output-live.log 2>&1
      - name: Preserve reports, not downloaded video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-pipeline
          path: |
            ci-output/live/*.json
            ci-output/live/processed/
            ci-output-live.log
          retention-days: 7
